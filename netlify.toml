[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Routing: Serve custom branded 404 page with HTTP 404 for any unmatched routes
# Existing static files (/, /for-freelance-agencies/, /building-in-public/, /about/, /assets/*)
# are served directly by Netlify before this redirect rule is evaluated.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# HTML: Revalidate immediately so new deployments appear without stale caching
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Crawling metadata: Revalidate daily
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Fingerprinted Assets: Long-term immutable caching for Vite bundle assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static Images: Conservative caching with stale-while-revalidate
[[headers]]
  for = "/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
