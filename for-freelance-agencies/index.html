        <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #0E1A2B;">A Dedicated CRM Workflow Built for Freelance Agencies</h1>
        <p style="margin-bottom: 1rem; color: #4A586B;">
          Most generic CRMs are built for large enterprise sales teams with heavy setup, while simple note and spreadsheet apps lack deal stages, background automations, and direct payment links.
        </p>
        <p style="margin-bottom: 1rem; color: #4A586B;">
          Freelance Agency CRM connects lead intake, a five-stage deal pipeline (New, Contacted, Proposal Sent, Won, Lost), and itemized client invoicing with public payment links into a single unified workspace.
        </p>
        <p style="margin-bottom: 1rem; color: #4A586B;">
          We are currently accepting 3 to 5 pilot freelance agencies to test real client workflows in exchange for 100% free access and 1-on-1 direct onboarding with the founder.
